<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF OCR Preview</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>PDF OCR — Preview & Submit</h1>

    <section id="upload">
      <label>PDF file
        <input type="file" id="pdfFile" accept="application/pdf">
      </label>

      <div class="row">
        <label>Pages to preview
          <input type="number" id="pages" min="1" max="3" value="1">
        </label>
        <label>DPI
          <input type="number" id="dpi" min="72" max="600" value="150">
        </label>
      </div>

      <div class="row sliders">
        <label>Contrast low %
          <input type="range" id="contrastLow" min="0" max="10" step="0.1" value="1.5">
          <span id="contrastLowVal">1.5</span>
        </label>
        <label>Contrast high %
          <input type="range" id="contrastHigh" min="50" max="100" step="0.1" value="99">
          <span id="contrastHighVal">99</span>
        </label>
        <label>Threshold %
          <input type="range" id="threshold" min="0" max="100" step="1" value="80">
          <span id="thresholdVal">80</span>
        </label>
      </div>

      <div class="row">
        <label><input type="checkbox" id="contrastStretch" checked> Enable contrast-stretch</label>
        <label><input type="checkbox" id="normalize" checked> Normalize</label>
      </div>

      <div class="actions">
        <button id="previewBtn">Preview</button>
        <button id="submitBtn">Submit</button>
      </div>
    </section>

    <section id="previews">
      <h2>Previews</h2>
      <div id="previewList"></div>
    </section>

    <section id="result">
      <h2>Job Status</h2>
      <div id="jobStatus">No job</div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
